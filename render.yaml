# Blueprint Render : l'API Hivation (Fastify).
# Architecture : site sur Vercel, API ici, base Postgres sur Supabase.
# Pas à pas : README.md, section « Déploiement ».
#
# Les variables « sync: false » sont demandées par Render à la création du Blueprint.
# Les secrets ne sont jamais écrits dans ce fichier.
services:
  - type: web
    name: harvest-api
    runtime: node
    region: frankfurt # à choisir proche de la région du projet Supabase
    # « free » s'endort après 15 min sans requête : la première requête suivante prend environ une minute.
    # Pour un usage réel, passez à « starter » (toujours allumé).
    plan: free
    rootDir: api
    # devDependencies incluses : tsc en a besoin pour compiler.
    buildCommand: npm ci --include=dev && npm run build
    # applique les migrations (avec un verrou), puis démarre le serveur
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Supabase : « Session pooler » (port 5432), PAS le pooler en mode transaction (6543).
      # Render gratuit est en IPv4 uniquement, ce que la connexion directe de Supabase n'est pas.
      - key: DATABASE_URL
        sync: false

      # Adresse publique du site (Vercel), ex. https://app.hivation.tech,https://www.hivation.tech — origines autorisées par CORS ;
      # la première (l'application) sert aux liens des e-mails et à la redirection après connexion. Plusieurs adresses : séparées par des virgules.
      - key: APP_URLS
        sync: false

      # Adresse publique de l'API VUE PAR LE NAVIGATEUR, utilisée pour les retours Google / GitHub.
      # Avec le sous-domaine de l'API : https://api.hivation.tech (sinon, avec le relais /api : https://app.hivation.tech/api)  (voir README).
      - key: API_URL
        sync: false

      # Connexion Google / GitHub (facultatif : laissez vide pour la désactiver)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # Service d'itinéraires (OSRM) des tournées. Par défaut le serveur de démonstration public (usage léger) : hébergez le
      # vôtre en production. « off » : aucun appel, les itinéraires sont estimés en ligne droite.
      - key: ROUTING_URL
        sync: false

      # Adresse qui reçoit les messages de la bulle de contact de la documentation (facultatif : sans elle, les messages
      # sont seulement gardés en base, table contact_messages).
      - key: SUPPORT_EMAIL
        sync: false

      # E-mails (invitations, mot de passe oublié) : clé API Resend. Facultatif : sans elle, les liens s'affichent à l'écran.
      - key: RESEND_API_KEY
        sync: false
      # Expéditeur, ex. « Hivation <noreply@hivation.tech> » (le domaine doit être vérifié chez Resend).
      - key: MAIL_FROM
        sync: false
